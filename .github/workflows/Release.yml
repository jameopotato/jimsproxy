name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag override (e.g. v5.2.1, or v5.2.0-beta.5). Leave empty for auto-increment.'
        required: false
        type: string

# JimsProxy is a Windows-only fork: HermesProxy.csproj pins
# <RuntimeIdentifier>win-x64</RuntimeIdentifier> whenever UsePublishBuildSettings
# is set, the launcher is Windows-only, and WowClassic_ForCustomServers.exe only
# exists on Windows. The inherited Ubuntu/MacOS matrix legs could therefore never
# produce a usable artifact, and were the direct cause of this workflow failing
# every run since it was inherited. See CHANGES.md 2026-08-22.

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASSET_BASENAME: JimsProxy

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            tag="${{ inputs.version }}"
            echo "Using manual version: $tag"
          else
            latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            # Strip 'v' prefix and normalize to major.minor.patch
            version="${latest#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next_patch=$((patch + 1))
            tag="v${major}.${minor}.${next_patch}"
            echo "Latest tag: $latest → Next: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --filter "FullyQualifiedName!~MovementInfoSpanTests"

  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Compute version for MSBuild
        id: ver
        shell: bash
        run: |
          semver="${{ needs.version.outputs.tag }}"
          semver="${semver#v}"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      # -o publish avoids globbing bin/Release/*/publish, which broke when the
      # RuntimeIdentifier subdirectory name changed.
      - name: Publish
        run: dotnet publish HermesProxy --configuration Release --use-current-runtime -p:UsePublishBuildSettings=true -p:UpdateVersionProperties=false -p:Version=${{ steps.ver.outputs.semver }} -p:AssemblyVersion=${{ steps.ver.outputs.semver }} -p:FileVersion=${{ steps.ver.outputs.semver }} -p:InformationalVersion=${{ steps.ver.outputs.semver }} -o publish

      - name: Verify publish output
        shell: bash
        run: |
          # AssemblyName is JimsProxy (HermesProxy.csproj), so the binary is
          # JimsProxy.exe. The old workflow looked for "HermesProxy" here and
          # failed every run.
          for f in publish/JimsProxy.exe publish/HermesProxy.config publish/CSV; do
            if [ ! -e "$f" ]; then
              echo "FAIL: expected $f in publish output"
              ls -la publish
              exit 1
            fi
          done
          echo "OK: JimsProxy.exe + HermesProxy.config + CSV/ present"

      - name: Add standalone setup notes
        shell: bash
        run: cp scripts/release-README.txt publish/README.txt

      # Files sit at the archive root (no wrapper directory) to match the
      # layout the launcher bundle and the manual setup docs both assume.
      - name: Package
        shell: pwsh
        run: |
          $name = "${{ env.ASSET_BASENAME }}-${{ needs.version.outputs.tag }}-win-x64"
          Compress-Archive -Path "publish\*" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_BASENAME }}-${{ needs.version.outputs.tag }}-win-x64
          path: ${{ env.ASSET_BASENAME }}-${{ needs.version.outputs.tag }}-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    needs: [version, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test result
        if: needs.test.result != 'success'
        run: |
          echo "Tests failed — aborting release"
          exit 1

      - name: Check build result
        if: needs.build.result != 'success'
        run: |
          echo "Build failed — aborting release"
          exit 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifact contents
        run: |
          zip=$(find artifacts -name "JimsProxy-*-win-x64.zip" -type f | head -1)
          if [ -z "$zip" ]; then
            echo "FAIL: no Windows artifact found"
            find artifacts -type f | sort
            exit 1
          fi

          size=$(stat --printf="%s" "$zip")
          echo "Artifact: $zip (${size} bytes)"
          # A self-contained single-file publish is tens of MB; anything much
          # smaller means the exe or the CSV tree is missing.
          if [ "$size" -lt 10000000 ]; then
            echo "FAIL: artifact is only ${size} bytes — likely missing the binary or CSV data"
            exit 1
          fi

          # The Windows binary cannot be executed on this runner, so assert on
          # archive contents instead.
          for entry in JimsProxy.exe HermesProxy.config README.txt; do
            if ! unzip -l "$zip" | grep -q "$entry"; then
              echo "FAIL: $entry missing from archive"
              unzip -l "$zip" | head -30
              exit 1
            fi
          done

          csv_count=$(unzip -l "$zip" | grep -c "CSV/" || true)
          if [ "$csv_count" -lt 20 ]; then
            echo "FAIL: only $csv_count CSV entries in archive — expected the full data set"
            exit 1
          fi

          echo "OK: archive contains the binary, config, setup notes and $csv_count CSV entries"

  release:
    needs: [version, test, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets and generate checksums
        run: |
          mkdir release-assets
          find artifacts -type f -name "*.zip" -exec cp {} release-assets/ \;
          cp scripts/verify-checksums.sh release-assets/
          cp scripts/verify-checksums.ps1 release-assets/
          cd release-assets
          sha256sum *.zip > checksums-sha256.txt
          echo "=== Release assets ==="
          ls -lh
          echo ""
          echo "=== Checksums ==="
          cat checksums-sha256.txt

      # Beta/prerelease tags are cut by hand, so the release often already
      # exists. Upload into it rather than failing on create.
      - name: Create release or attach assets to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          date=$(date +%Y-%m-%d)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading assets into it"
            gh release upload "$tag" release-assets/* --clobber
          else
            echo "Creating release $tag"
            gh release create "$tag" \
              --title "Release $tag ($date)" \
              --generate-notes \
              release-assets/*
          fi
